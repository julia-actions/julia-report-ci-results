name: 'Report Julia CI results'
description: 'Render a CI job summary from test-result JSON files and lint SARIF files'
inputs:
  results-path:
    description: 'Directory containing test-result *.json files (as written by julia-run-testitems)'
    required: true
  lint-results-path:
    description: 'Directory containing lint *.sarif file(s); may be missing or empty if lint was skipped'
    required: false
  allowed-failure-results-path:
    description: >-
      Directory containing test-result *.json files from matrix legs that are allowed to fail.
      Their failures are reported but never fail the step; may be missing or empty.
    required: false
  expected-profiles:
    description: >-
      JSON array of {"name": <profile name>, "allowFailure": <bool>} describing the matrix
      legs this run should have heard from. A leg that reported nothing is then called out
      in the summary instead of being silently left out of it, which is what a partial
      "Re-run failed jobs" looks like when an artifact is missing. Empty (the default)
      disables the check.
    required: false
  fail-on-missing-results:
    description: >-
      Fail the step when no test-result files are found in results-path, or when a leg
      listed in expected-profiles that is not allowed to fail reported nothing
    required: false
    default: true
  fail-on-test-failures:
    description: 'Fail the step when there are failing test items or test definition errors'
    required: false
    default: true
  fail-on-lint-errors:
    description: 'Fail the step when there are error-severity lint results'
    required: false
    default: true
  process-logs-retention-days:
    description: 'Retention in days for the uploaded test-process-logs artifact (empty = repository default)'
    required: false
outputs:
  failed:
    description: 'Whether any CI issues were found (independent of the fail-on-* settings)'
  test-count:
    description: 'Number of distinct test items in the report'
  failed-count:
    description: 'Number of test items with issues on a leg that must pass'
  allowed-failure-count:
    description: 'Number of test items whose only issues are on legs allowed to fail'
  definition-error-count:
    description: 'Number of test definition errors'
  lint-error-count:
    description: 'Number of error-severity lint results'
  missing-profiles:
    description: 'Comma-separated names of expected profiles that reported no results (blocking ones first)'
  process-logs-artifact-id:
    description: 'Id of the uploaded test-process-logs artifact (empty when nothing was uploaded)'
runs:
  using: 'node24'
  main: 'dist/index.js'
