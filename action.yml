name: 'Report Julia CI results'
description: 'Render a CI job summary from test-result JSON files and lint SARIF files'
inputs:
  results-path:
    description: 'Directory containing test-result *.json files (as written by julia-run-testitems)'
    required: true
  lint-results-path:
    description: 'Directory containing lint *.sarif file(s); may be missing or empty if lint was skipped'
    required: false
runs:
  using: 'node20'
  main: 'dist/index.js'
